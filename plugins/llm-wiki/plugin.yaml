name: llm-wiki
version: 0.9.28
description: "Deterministic B-Tree Markdown Wiki (configurable via plugins.llm-wiki.wikiDir) for AI agents"
config_defaults:
  wikiDir: ".rnex/wiki"
  indexFile: "index.md"
  logFile: "log.md"
  logMaxRecords: 1000
  btreeRootMaxLines: 80
  btreeShardMaxEntries: 100
  relativeLinks: "rewrite"
  sources:
    - "README.md"
    - "docs"
    - "{reposDir}/**/README.md"
commands:
  ingest:
    script: "bin/ingest.sh"
    description: "Ingest only missing sources from passed argument or configured sources into .rnex/wiki"
  lint:
    script: "bin/lint.sh"
    description: "Lint existing wiki docs, shard links, and target references inside .rnex/wiki"
