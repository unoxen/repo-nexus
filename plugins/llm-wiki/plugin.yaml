name: llm-wiki
version: 0.10.6
description: "Deterministic B-Tree Markdown Wiki (configurable via plugins.llm-wiki.wikiDir) for AI agents"
config_defaults:
  wikiDir: ".rnex/wiki"
  indexFile: "index.md"
  logFile: "log.md"
  logMaxRecords: 1000
  btreeRootMaxLines: 80
  btreeShardMaxEntries: 100
  recordSummaryMaxLength: 100
  relativeLinks: "rewrite"
  sources:
    - "README.md"
    - "docs"
    - "{reposDir}/**/README.md"
  exclude: []
commands:
  ingest:
    script: "bin/ingest.sh"
    description: "Ingest missing sources (or force-refresh existing entries with --force/-f) into .rnex/wiki"
  lint:
    script: "bin/lint.sh"
    description: "Validate and auto-heal existing wiki docs, headers, shard links, and references (--shallow for links only)"
