name: codex
version: 0.8.35
description: OpenAI Codex and ChatGPT integration (maintains CODEX.md instructions and generates user skills in .codex/skills/)
author: unoxen
homepage: https://github.com/unoxen/repo-nexus
skill_dir: .codex/skills

config_defaults:
  skills: true
  hooks:
    SessionStart:
      - "rnex sync --quiet"

config_descriptions:
  skills: "true|false        (generate user skills in {skill_dir})"
  hooks: "event map|false   (configure AI provider lifecycle hooks, e.g. SessionStart)"

instructions:
  - instructions/rnex-codex-integration.md: .rnex/plugins/codex/instructions/rnex-codex-integration.md
