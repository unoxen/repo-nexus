name: claude
version: 0.9.23
description: Anthropic Claude Code integration (maintains CLAUDE.md instructions and generates user skills in .claude/skills/)
author: unoxen
homepage: https://github.com/unoxen/repo-nexus
skill_dir: .claude/skills

config_defaults:
  skills: true

config_descriptions:
  skills: "true|false        (generate user skills in {skill_dir})"
  hooks: "event map         (configure AI provider lifecycle hooks, e.g. SessionStart)"

instructions:
  - instructions/rnex-claude-integration.md: .rnex/plugins/claude/instructions/rnex-claude-integration.md
