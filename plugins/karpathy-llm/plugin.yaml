name: karpathy-llm
version: 0.9.19
description: "Deterministic B-Tree Markdown Wiki in .rnex/wiki for AI agents"
config:
  wiki_dir: ".rnex/wiki"
  index_file: "index.md"
  log_file: "log.md"
  log_max_records: 1000
  btree_root_max_lines: 80
  btree_shard_max_entries: 100
  relative_links: "rewrite"
commands:
  ingest:
    script: "bin/ingest.sh"
    description: "Ingest only missing sources from passed argument or configured sources into .rnex/wiki"
  lint:
    script: "bin/lint.sh"
    description: "Lint existing wiki docs, shard links, and target references inside .rnex/wiki"
