name: windsurf
version: 0.5.1
description: Windsurf IDE integration (maintains .windsurfrules and generates user skills in .windsurf/rules/)
author: unoxen
homepage: https://github.com/unoxen/repo-nexus
skill_dir: .windsurf/rules

config_defaults:
  instructions: true
  skills: true

config_descriptions:
  instructions: "true|false  (maintain provider instructions)"
  skills: "true|false        (generate user skills in {skill_dir})"

instructions:
  - instructions/rnex-windsurf-integration.md: .rnex/plugins/windsurf/instructions/rnex-windsurf-integration.md
