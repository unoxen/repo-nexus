name: karpathy-llm
version: 0.8.17
description: Andréj Karpathy's verification frameworks & wiki patterns for AI coding agents.
author: unoxen
homepage: https://github.com/unoxen/repo-nexus

config_defaults:
  sources:
    - docs
    - "repos/**/README.md"
  wiki_dir: "wiki"

config_descriptions:
  sources: "<list>  (intake directories and/or glob patterns; .local.rnex.yaml list replaces rnex.yaml list)"
  wiki_dir: "<dir>  (directory for curated markdown pages)"

commands:
  ingest: "Ingest intake sources and repo docs into the wiki [--source <path>] [--repo <name>] [--quiet]"
  lint: "Validate wiki schema, link integrity, and word limits [--strict] [--quiet]"

rules:
  - rules/behavioral.md: .rnex/plugins/karpathy-llm/rules/behavioral.md
skills:
  - skills/wiki-ingest.md: .rnex/plugins/karpathy-llm/skills/wiki-ingest.md
  - skills/wiki-lint.md: .rnex/plugins/karpathy-llm/skills/wiki-lint.md
instructions:
  - instructions/rnex-wiki-architecture.md: .rnex/plugins/karpathy-llm/instructions/rnex-wiki-architecture.md
templates:
  - templates/index.md: "{wiki_dir}/index.md"
  - templates/_log.md: "{wiki_dir}/_log.md"
  - templates/hot.md: "{wiki_dir}/hot.md"
  - templates/rnex-wiki-page.sample.md: .rnex/plugins/karpathy-llm/templates/rnex-wiki-page.template.md
  - templates/rnex-llm-wiki.sample.md: .rnex/plugins/karpathy-llm/templates/rnex-llm-wiki.sample.md
