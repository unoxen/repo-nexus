name: gemini
version: 0.5.1
description: Google Gemini and Antigravity integration (maintains GEMINI.md instructions and generates user skills in .gemini/skills/)
author: unoxen
homepage: https://github.com/unoxen/repo-nexus
skill_dir: .gemini/skills

config_defaults:
  instructions: true
  skills: true

config_descriptions:
  instructions: "true|false  (maintain provider instructions)"
  skills: "true|false        (generate user skills in {skill_dir})"

instructions:
  - instructions/rnex-gemini-integration.md: .rnex/plugins/gemini/instructions/rnex-gemini-integration.md
