name: gemini
version: 0.8.17
description: Google Gemini and Antigravity integration (maintains GEMINI.md instructions and generates user skills in .agents/skills/)
author: unoxen
homepage: https://github.com/unoxen/repo-nexus
skill_dir: .agents/skills

config_defaults:
  skills: true
  auto_sync_on: SessionStart

config_descriptions:
  skills: "true|false        (generate user skills in {skill_dir})"
  auto_sync_on: "SessionStart|false  (trigger auto-sync on lifecycle event, e.g. SessionStart)"

instructions:
  - instructions/rnex-gemini-integration.md: .rnex/plugins/gemini/instructions/rnex-gemini-integration.md
