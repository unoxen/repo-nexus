# Repo Nexus workspace configuration
# See templates/rnex.example.yaml for a comprehensive example with all options.

version: 0.8.2

# Directory for member repository clones (relative to this file or absolute)
repos_dir: ./repos

# VS Code / Cursor multi-root workspace file (default: false; e.g. true or workspace.code-workspace)
code_workspace: false

# Git Integration (Ignore rules & Git hooks)
git:
  ignore:
    - "repos/"
    - "**/.rnex*/"
    - "**/rnex*/"
  hooks:
    post-merge:
      - "rnex sync --quiet"
    post-checkout:
      - "rnex sync --quiet"
    pre-commit: []
    pre-push: []

# RNEX Lifecycle Hooks (Map of RNEX events to command lists)
rnex_hooks:
  before_sync: []
  after_sync: []
  before_clone: []
  after_clone: []

# Member repositories managed by Repo Nexus
repos:

plugins:
