# ==============================================================================
# rnex.yaml — Repo Nexus Workspace Configuration (Full Example)
# ==============================================================================
# This file is the central team manifest for a Repo Nexus workspace (committed to Git).
#
# TWO-LEVEL CONFIGURATION:
#   1. Repo Config (rnex.yaml): Shared across team, tracks member repos, URLs, plugins.
#   2. Local Config (.local.rnex.yaml): Machine-specific (gitignored, highest priority),
#      overrides enable/disable states, URLs, or local developer settings.
#
# Place it in your workspace root directory and run `rnex sync` to apply.
#
# For more information: https://github.com/unoxen/repo-nexus

# ------------------------------------------------------------------------------
# version — Workspace configuration schema version
# ------------------------------------------------------------------------------
# Used by `rnex sync` and `rnex update` to safely detect and reconcile configuration
# and routing instructions across CLI releases.
#
version: 0.5.0

# ------------------------------------------------------------------------------
# repos_dir — Directory for member repository clones
# ------------------------------------------------------------------------------
# Default: ./repos (ignored by Git in the workspace .gitignore)
#
# Examples:
#   repos_dir: ./repos              # relative (recommended)
#   repos_dir: ./custom-repos       # custom relative path

repos_dir: ./repos

# ------------------------------------------------------------------------------
# code_workspace — VS Code / Cursor multi-root workspace file
# ------------------------------------------------------------------------------
# Automatically generates and maintains a multi-root .code-workspace file mapping
# the workspace root and all active member repository clones.
#
# Default: false
#
# Examples:
#   code_workspace: false                    # disabled (default)
#   code_workspace: true                     # generates <workspace-name>.code-workspace
#   code_workspace: workspace.code-workspace # custom filename
#
code_workspace: false

# ------------------------------------------------------------------------------
# git_hooks — Automated workspace Git hooks
# ------------------------------------------------------------------------------
# Enables automated Git hooks in `.rnex/hooks/` (post-merge auto-sync and
# optional plugin triggers like Karpathy wiki lint on commit/push).
#
# Default: true (when initialized in a Git repository)
#
# Examples:
#   git_hooks: true     # active (core.hooksPath = .rnex/hooks)
#   git_hooks: false    # disabled
#
git_hooks: true

# ------------------------------------------------------------------------------
# plugins — Workspace plugins, tool integrations, and AI instruction packs
# ------------------------------------------------------------------------------
# Plugins extend your workspace with curated AI guidelines, context rules,
# tool provider integrations (e.g. GitHub Copilot), and templates.
#
# Manage plugins with:
#   rnex plugin list                 # View available and active plugins
#   rnex plugin enable [--local] <name>  # Enable plugin (global or local override)
#   rnex plugin disable [--local] <name> # Disable plugin from workspace
#   rnex plugin info <name>          # View plugin details & configurable options
#
# Built-in plugins:
#   claude         — Anthropic Claude Code integration: manages CLAUDE.md; generates user skills in .claude/skills/
#   gemini         — Google Gemini / Antigravity integration: manages GEMINI.md; generates user skills in .gemini/skills/
#   cursor         — Cursor IDE integration: manages .cursorrules & .cursor/rules/; generates user skills in .cursor/rules/
#   windsurf       — Windsurf IDE integration: manages .windsurfrules; generates user skills in .windsurf/rules/
#   karpathy-llm   — Andrej Karpathy's agent behavioral principles,
#                    context engineering guidelines, and LLM Wiki architecture
#
# Note on AI Architecture:
#   AGENTS.md at workspace root is the universal cross-tool standard. Assistants that read AGENTS.md
#   all the time need no separate top-level instructions file. Assistants with native
#   formats (Claude with CLAUDE.md, Gemini with GEMINI.md, Cursor with .cursorrules, Windsurf with .windsurfrules)
#   have their instruction files maintained when their plugin is enabled (instructions: true).
#   Agentic skills live self-contained inside .rnex/skills/ (core) and .rnex/plugins/<plugin>/skills/ (plugins).
#   Provider plugins generate zero-logic User Skills (prefixed with rnex-) into IDE-specific skill directories
#   linking directly to the agentic skill protocols inside .rnex/.

plugins:
  # claude:
  #   instructions: true   # sync routing instructions to CLAUDE.md (default: true)
  #   skills: true         # generate user skills in .claude/skills/ (default: true)
  # gemini:
  #   instructions: true   # sync routing instructions to GEMINI.md (default: true)
  #   skills: true         # generate user skills in .gemini/skills/ (default: true)
  # cursor:
  #   instructions: true   # sync routing instructions to .cursorrules (default: true)
  #   skills: true         # generate user skills in .cursor/rules/ (default: true)
  # windsurf:
  #   instructions: true   # sync routing instructions to .windsurfrules (default: true)
  #   skills: true         # generate user skills in .windsurf/rules/ (default: true)
  # karpathy-llm:
  #   raw_dir: "./docs"           # Append-only directory for unmodified intake documents (default: ./docs)
  #   wiki_dir: ".rnex/wiki"      # Directory for curated atomic markdown pages (default: .rnex/wiki)
  #   lint_trigger: "manual"      # Runs manually via 'rnex sync' or validation checklists (git-post-merge, git-post-commit, git-pre-commit, git-pre-push, manual)
  #   notify_on_changes: true     # Show notification when changes are committed to ./docs or .rnex/wiki

# ------------------------------------------------------------------------------
# repos — Member repositories managed by Repo Nexus
# ------------------------------------------------------------------------------
# Each repo has:
#   url:      Git repository URL (SSH or HTTPS).
#   enabled:  true (default) keeps the repo active in workspace.
#             false disables the repo (skipped by rnex clone, rnex exec, etc.).
#             Can be overridden locally in .local.rnex.yaml.
#   rnex_dir: true (default) creates an isolated .rnex/ directory inside the member repo
#             for storing rnex-related documents, rules, workflows, and scripts.
#             Set to false to leave the member repository completely untouched.
#
# Examples:
#   backend:
#     url: git@github.com:myorg/backend-api.git
#     enabled: true        # default
#     rnex_dir: true       # default
#
#   frontend:
#     url: https://github.com/myorg/web-app.git
#     enabled: true
#     rnex_dir: true
#
#   analytics:
#     url: git@github.com:myorg/analytics.git
#     enabled: false       # disabled: skipped by clone & exec
#     rnex_dir: false

repos:
  # backend:
  #   url: git@github.com:myorg/backend-api.git
  #   rnex_dir: true
  #
  # frontend:
  #   url: https://github.com/myorg/web-app.git
  #   rnex_dir: true
  #
  # analytics:
  #   url: git@github.com:myorg/analytics.git
  #   enabled: false
