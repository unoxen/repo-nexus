# ==============================================================================
# rnex.yaml — Repo Nexus Workspace Configuration (Exhaustive Schema Showcase)
# ==============================================================================
# Central team manifest for a Repo Nexus workspace (committed to Git).
#
# TWO-LEVEL CONFIGURATION:
#   1. Team Manifest (rnex.yaml): Shared across team, tracks member repos, URLs, plugins.
#   2. Local Overrides (.local.rnex.yaml): Machine-specific (gitignored, highest priority),
#      overrides enable/disable states, URLs, read-only flags, or developer settings.

# Workspace Metadata
version: "1"
name: "acme-platform"
description: "Multi-repo platform workspace and shared AI context"
# Directory where member repositories are cloned (default: "./repos").
# Automatically added to workspace .gitignore and un-ignored in .ignore.
reposDir: "./repos"
codeWorkspace: "acme.code-workspace"

# Git Integration (Ignore rules & Git hooks)
git:
  ignore:
    - "repos/"
    - "**/.rnex*"
    - "**/rnex*"
    - "!rnex.yaml"
    - "!**/rnex.yaml"
    - "*.log"
    - ".env.local"
  hooks:
    post-merge:
      - "rnex sync --quiet"
    post-checkout:
      - "rnex sync --quiet"
    pre-commit:
      - "rnex plugin llm-wiki lint --shallow"
    pre-push:
      - "rnex plugin llm-wiki lint"

# ==============================================================================
# RNEX Lifecycle Hooks (Strictly Opt-In — Nothing Enabled by Default)
# ==============================================================================
# Zero hidden hooks: Repo Nexus never executes lifecycle actions unless explicitly
# declared in rnex.yaml or .local.rnex.yaml.
rnexHooks:
  beforeInit: []
  afterInit:
    - "echo 'Workspace initialized'"
  beforeSync: []
  afterSync:
    - "rnex plugin llm-wiki ingest"
  beforeClone: []
  afterClone:
    - "rnex exec npm install"
  beforeRepoAdd: []
  afterRepoAdd: []
  beforeRepoRemove: []
  afterRepoRemove: []
  beforeRepoSet: []
  afterRepoSet: []
  beforePluginEnable: []
  afterPluginEnable: []
  beforePluginDisable: []
  afterPluginDisable: []
  beforePluginCommand: []
  afterPluginCommand: []
  beforeExec: []
  afterExec: []

# Member Repositories
repos:
  backend:
    url: "git@github.com:acme/backend-api.git"
    branch: "main"
    enabled: true
    readonly: false
    description: "Core Go/PostgreSQL API service"
  frontend:
    url: "https://github.com/acme/web-client.git"
    branch: "develop"
    enabled: true
    readonly: false
    description: "React/TypeScript web application"
  shared-contracts:
    url: "git@github.com:acme/contracts.git"
    branch: "v2"
    enabled: true
    readonly: true
    description: "Read-only OpenAPI & Protobuf schemas"

# Scoped Plugins & AI Providers
# AI provider hooks are strictly opt-in. Declaring hooks.SessionStart synchronizes
# the workspace at assistant session startup. Omitting hooks leaves native manifests
# completely untouched or cleans up managed hook entries.
plugins:
  claude:
    enabled: true
    skills: true
    hooks:
      SessionStart:
        - "rnex sync --quiet"
  cursor:
    enabled: true
    skills: true
    hooks:
      SessionStart:
        - "rnex sync --quiet"
  codex:
    enabled: true
    skills: true
    hooks:
      SessionStart:
        - "rnex sync --quiet"
  gemini:
    enabled: false
    skills: true
    hooks:
      SessionStart:
        - "rnex sync --quiet"
  windsurf:
    enabled: false
    skills: true
    hooks:
      SessionStart:
        - "rnex sync --quiet"
  copilot:
    enabled: false
    skills: true
    hooks:
      SessionStart:
        - "rnex sync --quiet"
  # External / Custom Plugin (supports relative directory or plugin.yaml manifest path)
  my-plugin:
    enabled: true
    path: "./custom-plugins/my-plugin"
  llm-wiki:
    enabled: true
    wikiDir: ".rnex/wiki"
    indexFile: "index.md"
    logFile: "log.md"
    btreeRootMaxLines: 80
    btreeShardMaxEntries: 100
    sources:
      - "docs"
      - "adr"
      - "repos/**/README.md"
