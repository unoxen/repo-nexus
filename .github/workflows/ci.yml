name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'

  test:
    name: Automated Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Test Suite
        run: |
          chmod +x rnex tests/test_cli.sh
          ./tests/test_cli.sh

  publish:
    name: Publish to npm & GitHub Packages
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm CLI
        run: npm install -g npm@latest

      - name: Check and Stage Publish to npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Checking if ${PKG_NAME}@${PKG_VERSION} is already published on npm..."
          PUBLISHED_VERSION=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)

          if [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
            echo "Version ${PKG_VERSION} of ${PKG_NAME} is already published to npm. Skipping publish."
          else
            echo "Staging ${PKG_NAME}@${PKG_VERSION} on npm..."
            npm stage publish
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "${GPR_OWNER:-nu-nenoi}" | tr '[:upper:]' '[:lower:]')
          echo "Configuring GitHub Packages registry for @${OWNER}..."
          npm config set @${OWNER}:registry=https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}

          CURRENT_COMMIT=$(git rev-parse HEAD)

          # Backfill any missing tagged versions to GitHub Packages
          for TAG in $(git tag -l "v*"); do
            TAG_VER="${TAG#v}"
            echo "Checking if @${OWNER}/repo-nexus@${TAG_VER} is published on GitHub Packages..."
            GPR_VER=$(npm view "@${OWNER}/repo-nexus@${TAG_VER}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)
            if [ "$GPR_VER" != "$TAG_VER" ]; then
              echo "Publishing missing version ${TAG_VER} (${TAG}) to GitHub Packages..."
              git checkout -f "$TAG" -q
              node -e '
                const pkg = require("./package.json");
                const owner = (process.env.GPR_OWNER || "nu-nenoi").toLowerCase();
                pkg.name = `@${owner}/repo-nexus`;
                pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
                require("fs").writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
              '
              npm publish --registry=https://npm.pkg.github.com || echo "Skipping ${TAG_VER}..."
              git checkout -f "$CURRENT_COMMIT" -q
            fi
          done

          git checkout -f "$CURRENT_COMMIT" -q

          # Scope and publish current HEAD version if not already published
          node -e '
            const pkg = require("./package.json");
            const owner = (process.env.GPR_OWNER || "nu-nenoi").toLowerCase();
            pkg.name = `@${owner}/repo-nexus`;
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            require("fs").writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Checking if @${OWNER}/repo-nexus@${PKG_VERSION} is already published on GitHub Packages..."
          GPR_VERSION=$(npm view "@${OWNER}/repo-nexus@${PKG_VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)

          if [ "$GPR_VERSION" = "$PKG_VERSION" ]; then
            echo "Version ${PKG_VERSION} of @${OWNER}/repo-nexus is already published on GitHub Packages. Skipping."
          else
            echo "Publishing @${OWNER}/repo-nexus@${PKG_VERSION} to GitHub Packages..."
            npm publish --registry=https://npm.pkg.github.com
          fi
