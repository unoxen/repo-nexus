<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Emerald-to-Cyan Accent Gradient -->
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Cyan-to-Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Network Interconnection Paths -->
  <g stroke="url(#nexusGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0" opacity="0.85">
    <!-- Top-Left to Center -->
    <line x1="34" y1="36" x2="64" y2="64"/>
    <!-- Top-Right to Center -->
    <line x1="94" y1="36" x2="64" y2="64"/>
    <!-- Bottom to Center -->
    <line x1="64" y1="98" x2="64" y2="64"/>
    <!-- Lateral connection between top nodes -->
    <path d="M34 36 Q 64 24 94 36" stroke="#475569" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  </g>

  <!-- Outer Satellite Nodes (Member Repositories) -->
  <!-- Node 1: Left / Backend -->
  <circle cx="34" cy="36" r="11" fill="#1e293b" stroke="url(#nexusGrad)" stroke-width="2.5"/>
  <circle cx="34" cy="36" r="5" fill="#34d399"/>

  <!-- Node 2: Right / Frontend -->
  <circle cx="94" cy="36" r="11" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="2.5"/>
  <circle cx="94" cy="36" r="5" fill="#38bdf8"/>

  <!-- Node 3: Bottom / Shared & AI Context -->
  <circle cx="64" cy="98" r="11" fill="#1e293b" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="64" cy="98" r="5" fill="#818cf8"/>

  <!-- Central Nexus Core (Meta-Repo Hub) -->
  <circle cx="64" cy="64" r="21" fill="#0f172a" stroke="url(#nexusGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Stylized "N" inside the Central Nexus Core -->
  <path d="M56 74 L56 54 L72 74 L72 54" stroke="#f8fafc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
