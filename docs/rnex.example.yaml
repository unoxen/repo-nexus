# ==============================================================================
# rnex.yaml — Repo Nexus Workspace Configuration (Exhaustive Schema Showcase)
# ==============================================================================
# Central team manifest for a Repo Nexus workspace (committed to Git).
#
# TWO-LEVEL CONFIGURATION:
#   1. Team Manifest (rnex.yaml): Shared across team, tracks member repos, URLs, plugins.
#   2. Local Overrides (.local.rnex.yaml): Machine-specific (gitignored, highest priority),
#      overrides enable/disable states, URLs, read-only flags, or developer settings.

# Workspace Metadata
version: "1"
name: "acme-platform"
description: "Multi-repo platform workspace and shared AI context"
# Directory where member repositories are cloned (default: "repos").
# Automatically added to workspace .gitignore and un-ignored in .ignore.
repos_dir: "repos"
code_workspace: "acme.code-workspace"

# Git Integration (Ignore rules & Git hooks)
git:
  ignore:
    - "repos/"  # Note: repos_dir is automatically managed in .gitignore alongside git.ignore
    - "**/.rnex*/"
    - "**/rnex*/"
    - "*.log"
    - ".env.local"
  hooks:
    post-merge:
      - "rnex sync --quiet"
    post-checkout:
      - "rnex sync --quiet"
    pre-commit:
      - "rnex plugin karpathy-llm lint"
    pre-push:
      - "rnex plugin karpathy-llm lint --strict"

# Lifecycle Hooks (Map of RNEX events to command lists)
rnex_hooks:
  before_init: []
  after_init:
    - "echo 'Workspace initialized'"
  before_sync: []
  after_sync:
    - "rnex plugin karpathy-llm ingest --quiet"
  before_clone: []
  after_clone:
    - "rnex exec npm install"
  before_repo_add: []
  after_repo_add: []
  before_repo_remove: []
  after_repo_remove: []
  before_repo_set: []
  after_repo_set: []
  before_plugin_enable: []
  after_plugin_enable: []
  before_plugin_disable: []
  after_plugin_disable: []
  before_plugin_command: []
  after_plugin_command: []
  before_exec: []
  after_exec: []

# Member Repositories
repos:
  backend:
    url: "git@github.com:acme/backend-api.git"
    branch: "main"
    enabled: true
    readonly: false
    description: "Core Go/PostgreSQL API service"
  frontend:
    url: "https://github.com/acme/web-client.git"
    branch: "develop"
    enabled: true
    readonly: false
    description: "React/TypeScript web application"
  shared-contracts:
    url: "git@github.com:acme/contracts.git"
    branch: "v2"
    enabled: true
    readonly: true
    description: "Read-only OpenAPI & Protobuf schemas"

# Scoped Plugins & AI Providers
plugins:
  claude:
    enabled: true
    skills: true
  cursor:
    enabled: true
    skills: true
  codex:
    enabled: true
    skills: true
  gemini:
    enabled: false
    skills: true
  windsurf:
    enabled: false
    skills: true
  copilot:
    enabled: false
    skills: true
  karpathy-llm:
    enabled: true
    wiki_dir: "wiki"
    sources:
      - "docs"
      - "adr"
      - "repos/**/README.md"
